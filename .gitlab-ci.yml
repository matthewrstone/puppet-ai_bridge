stages: [test]

go-test:
  stage: test
  image: golang:1.24
  script:
    - cd tools/pe-capture
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test -race -cover ./...

puppet-lint:
  stage: test
  image: puppet/pdk:latest
  script:
    - gem install bundler
    - bundle install
    - bundle exec puppet parser validate manifests/*.pp types/*.pp
    - bundle exec puppet-lint --relative --fail-on-warnings manifests types plans
    - bundle exec metadata-json-lint metadata.json

rspec-puppet:
  stage: test
  image: puppet/pdk:latest
  script:
    - gem install bundler
    - bundle install
    - bundle exec rake spec_prep
    - bundle exec rspec spec/classes/init_spec.rb

yaml-validate:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -q pyyaml
    - python -c "import yaml,glob;[yaml.safe_load(open(f)) for f in glob.glob('litellm/*.yml')+glob.glob('litellm/*.yaml')+glob.glob('examples/*.yaml')+['data/common.yaml']];print('yaml ok')"

python-unit:
  stage: test
  image: python:3.12-slim
  script:
    - python3 -B -m unittest discover -s tests -p test_pe_usage.py
    - python3 -B -m unittest discover -s tests -p test_personality.py
    - python3 -B -m unittest discover -s tests -p test_docker_runtime.py
    - python3 -B -m unittest discover -s tests -p test_bolt_parameters.py

# Real callback API tests run separately in the pinned LiteLLM image.
