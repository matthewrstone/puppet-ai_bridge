---
# Control-repo Hiera example: PE AI Agent -> Claude.
# Place under data/nodes/ai-bridge.souldo.lan.yaml (or a role-level file).
ai_bridge::backend: anthropic
ai_bridge::upstream_model: claude-sonnet-4-5
ai_bridge::upstream_api_key: >
  ENC[PKCS7,MIIB...anthropic key...]
ai_bridge::master_key: >
  ENC[PKCS7,MIIB...openssl rand -hex 32...]
ai_bridge::extra_aliases:
  o3: anthropic/claude-opus-4-1
  gpt-4o: anthropic/claude-sonnet-4-5
ai_bridge::tls_cert: |
  -----BEGIN CERTIFICATE-----
  ... issued by Step CA for ai-bridge.souldo.lan ...
  -----END CERTIFICATE-----
ai_bridge::tls_key: >
  ENC[PKCS7,MIIB...private key...]
