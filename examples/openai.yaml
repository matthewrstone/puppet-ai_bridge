  ENC[PKCS7,MIIB...]
ai_bridge::tls_cert: |
  -----BEGIN CERTIFICATE-----
  ...
  -----END CERTIFICATE-----
ai_bridge::tls_key: >
  ENC[PKCS7,MIIB...]
